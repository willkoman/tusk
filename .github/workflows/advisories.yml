name: advisories

# Security advisories are published every day, independently of our commits. The
# weekly `validate` run and pull-request CI only see them when something else happens,
# so a new RustSec/GitHub advisory against master could sit unnoticed (RUSTSEC-2026-0387
# did) and then block the next release. This scans master daily and keeps exactly one
# open issue while the scan fails, closing it once the scan passes again.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  scan:
    name: Scan dependencies for advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_TITLE: Security advisory affects master dependencies
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Scan
        id: scan
        shell: bash
        run: |
          status=0
          {
            echo "## npm audit (high and above)"
            echo '```'
            npm audit --audit-level=high 2>&1 || status=1
            echo '```'
            echo "## cargo deny check advisories"
            echo '```'
            cargo deny --color never --manifest-path src-tauri/Cargo.toml check advisories 2>&1 || status=1
            echo '```'
          } > report.md
          cat report.md
          echo "failed=$status" >> "$GITHUB_OUTPUT"

      - name: Open or update the advisory issue
        if: steps.scan.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "The daily advisory scan of \`master\` failed: $RUN_URL"
            echo
            echo "Fix it before the next release: the release workflow refuses to build while this fails."
            echo "A compatible fix is usually \`cargo update -p <crate>\` (see each advisory's *Solution*) or a Dependabot update."
            echo "An advisory with no fix that cannot reach Tusk gets a reasoned entry in \`deny.toml\`."
            echo
            head -c 60000 report.md
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file body.md
          fi
          exit 1

      - name: Close the advisory issue once master is clean
        if: steps.scan.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The advisory scan passes again: $RUN_URL"
          fi
