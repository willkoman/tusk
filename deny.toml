[advisories]
version = 2
yanked = "warn"
# Tauri's Linux WebView stack and several driver/rendering internals still pull
# crates with no maintained replacement. Fail if Tusk adopts one directly;
# vulnerabilities and unsound advisories remain denied at every depth.
unmaintained = "workspace"
ignore = [
  # RUSTSEC-2023-0071 — the "Marvin Attack" timing sidechannel in the `rsa` crate,
  # reached through `russh`'s optional `rsa` feature (SSH tunnelling).
  #
  # Re-checked 2026-11-09: the advisory now lists `rsa >= 0.10.0` as patched and
  # 0.10.0 final is out, but russh 0.65.1 (the latest) pins `rsa = "=0.10.0-rc.18"`,
  # so the lock cannot take it. Drop this entry once russh releases against 0.10.0.
  # Dropping the feature would drop `ssh-rsa` host keys and `id_rsa` client keys,
  # which is still what most existing bastions and users have.
  #
  # The advisory is an adaptive timing oracle over repeated RSA *decryptions*. Tusk
  # never decrypts with RSA: the crate verifies a server host-key signature and signs
  # at most one authentication challenge per connection attempt, against a host the
  # user chose and whose key they already trusted.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2026-0367 / -0368 / -0369 / -0429 — `zip` < 9.0: `ZipArchive::extract`
  # follows attacker-controlled symlinks out of the destination, applies permissions
  # through them, keeps SUID/SGID bits, and aborts the process on a symlink entry
  # with a huge declared size. The fix is a major version (9.0). Every runtime user
  # of zip is on it (calamine, rust_xlsxwriter and tauri-plugin-updater 2.14.1 all
  # resolve zip 9.5); the one older copy left (re-checked 2026-11-09: zip 6.0.0) is a
  # BUILD dependency of libduckdb-sys 1.4, which extracts its own bundled DuckDB
  # source archive at compile time. It is not linked into Tusk and never sees a
  # user's file. Revisit with the next DuckDB engine upgrade.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
