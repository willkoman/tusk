[advisories]
version = 2
yanked = "warn"
# Tauri's Linux WebView stack and several driver/rendering internals still pull
# crates with no maintained replacement. Fail if Tusk adopts one directly;
# vulnerabilities and unsound advisories remain denied at every depth.
unmaintained = "workspace"
ignore = [
  # RUSTSEC-2023-0071 — the "Marvin Attack" timing sidechannel in the `rsa` crate,
  # reached through `russh`'s optional `rsa` feature (SSH tunnelling).
  #
  # Re-checked 2026-09-08 against `rsa 0.10.0-rc.18`, the version this lock resolves
  # (via russh and ssh-key). The advisory still reports "No patch is yet available"
  # and cargo-deny still reports "No safe upgrade is available!": the 0.10 pre-release
  # line is affected too, so being ahead of 0.9.x buys nothing here. Dropping the
  # feature would drop `ssh-rsa` host keys and `id_rsa` client keys, which is still
  # what most existing bastions and users have.
  #
  # The advisory is an adaptive timing oracle over repeated RSA *decryptions*. Tusk
  # never decrypts with RSA: the crate verifies a server host-key signature and signs
  # at most one authentication challenge per connection attempt, against a host the
  # user chose and whose key they already trusted. Revisit when `rsa` ships a
  # mitigated release.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2026-0367 / -0368 / -0369 — `zip` < 9.0: `ZipArchive::extract` follows
  # attacker-controlled symlinks out of the destination, applies permissions through
  # them, and keeps SUID/SGID bits. The fix is a major version (9.0) that none of the
  # four crates pulling `zip` in accepts yet (checked 2026-10-20 against zip 4.6.1,
  # 6.0.0 and 8.6.0), so `cargo update` cannot clear it.
  #
  # Every advisory is about EXTRACTING an archive to disk. Where Tusk's tree does that:
  #   - calamine 0.36 (xlsx import) and rust_xlsxwriter 0.99 (xlsx export) read and
  #     write entries in memory only; neither calls `extract`.
  #   - libduckdb-sys 1.4 extracts its own bundled DuckDB source at BUILD time.
  #   - tauri-plugin-updater 2.11 extracts a downloaded update only when it is a zip,
  #     and only after `download()` has verified its minisign signature against the
  #     pubkey in tauri.conf.json. Tusk ships signed `.exe`/`.msi` updates, not zips.
  # None of these reaches attacker-controlled archive contents. Revisit when the
  # dependents move to zip >= 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
