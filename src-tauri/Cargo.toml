[package]
name = "tusk"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"
bytes = "1"
futures-util = "0.3"
rust_xlsxwriter = { version = "0.95.0", features = ["constant_memory"] }
# AI provider proxy (streaming HTTP). rustls to avoid an OpenSSL build dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Embedded DuckDB. `bundled` statically compiles libduckdb from source (no system
# dep) — larger binary + slow first build, but a self-contained installer.
duckdb = { version = "1", features = ["bundled"] }
# Embedded SQLite. `bundled` statically compiles SQLite (small, fast) + `column_decltype`
# for declared column types in introspection.
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
# MySQL (network). Pure-Rust async driver; its `Pool` is Send+Sync (avoids the
# !Sync-connection problem) and its `Value` enum makes all-text extraction easy.
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }

# Dev builds: full debuginfo for the bundled DuckDB/Arrow/SQLite tree costs
# ~20 GB of target/ artifacts and regularly fills the disk. line-tables-only
# keeps usable backtraces at a fraction of the size; deps get none at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
# Test-only: async test runtime (the app uses Tauri's runtime, so the main tokio dep
# stays lean). Enables `#[tokio::test]` for the driver conformance suite.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
