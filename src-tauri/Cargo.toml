[package]
name = "tusk"
version = "0.9.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Built-in updater: checks the GitHub release `latest.json` manifest (signed
# artifacts) + relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "macros"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"
bytes = "1"
futures-util = "0.3"
rust_xlsxwriter = { version = "0.95.0", features = ["constant_memory"] }
# Atomic sibling-file writes for exports, profiles, history, and editor saves.
tempfile = "3"
# AI provider proxy (streaming HTTP). rustls to avoid an OpenSSL build dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Slack Socket Mode (desktop-hosted bot — outbound WebSocket only, no HTTP server).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Pin the process-wide rustls CryptoProvider to ring: reqwest's rustls-tls is
# ring-flavored while tokio-tungstenite's rustls defaults to aws-lc-rs — with both
# providers in the graph rustls has NO default and panics at TLS-config build time.
# lib.rs installs ring as the default at startup (and ring avoids the CMake+NASM
# toolchain aws-lc-rs needs on Windows).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Local chart rendering for the Slack bot (no external chart service). ab_glyph =
# pure-Rust font rendering off an EMBEDDED font (assets/JetBrainsMono-Regular.ttf,
# OFL) — deterministic, no system-font dependency. IMPORTANT: keep
# default-features = false — the default `ttf` feature (font-kit) silently WINS
# over `ab_glyph` when both are enabled.
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "ab_glyph", "line_series", "histogram"] }
png = "0.18"
# Embedded DuckDB. `bundled` statically compiles libduckdb from source (no system
# dep) — larger binary + slow first build, but a self-contained installer.
# Pinned to the STABLE 1.4.x line: the registry also carries `1.105xx` *preview* builds
# (DuckDB 1.5.x) that sort higher than 1.4.x, so a loose `version = "1"` resolved to a
# broken preview (v1.5.3) where even `CURRENT_DATE - INTERVAL` failed to bind. `~1.4`
# excludes the 1.5 preview line.
duckdb = { version = "~1.4", features = ["bundled"] }
# Render DuckDB's temporal `Value` variants (Date32/Timestamp/Time64) to readable
# text on the rare non-VARCHAR-cast paths (introspection / sample rows / non-cursorable
# reads). Already in the tree transitively.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Embedded SQLite. `bundled` statically compiles SQLite (small, fast) + `column_decltype`
# for declared column types in introspection.
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
# MySQL (network). Pure-Rust async driver; its `Pool` is Send+Sync (avoids the
# !Sync-connection problem) and its `Value` enum makes all-text extraction easy.
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }

# Dev builds: full debuginfo for the bundled DuckDB/Arrow/SQLite tree costs
# ~20 GB of target/ artifacts and regularly fills the disk. line-tables-only
# keeps usable backtraces at a fraction of the size; deps get none at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
# Test-only: async test runtime (the app uses Tauri's runtime, so the main tokio dep
# stays lean). Enables `#[tokio::test]` for the driver conformance suite.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
